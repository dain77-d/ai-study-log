name: math-lint
on: [push, pull_request]
jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub strips backslashes before MathJax runs: no \{ \} \| \, \; \! \\ \& and no & in inline math.
      # See the docstring of the script for replacements; run it locally with --fix before committing.
      - run: python3 .github/scripts/math_lint.py
